<!DOCTYPE html> 
<html> 
<head> 
    <title>Had404p</title> 
    <style> 
        body { 
            background-color: #000000; 
            margin: 0; 
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        } 
        .bouncing-img { 
            width: 150px;
            height: 150px;
            object-fit: contain;
            position: absolute;
            will-change: transform;
        } 
    </style> 
</head> 
<body> 

    <img class="bouncing-img" src="stuff/images/image.png" alt="Bouncing Target">
    <img class="bouncing-img" src="stuff/images/image.png" alt="Bouncing Target">
    <img class="bouncing-img" src="stuff/images/image.png" alt="Bouncing Target">
    <img class="bouncing-img" src="stuff/images/image.png" alt="Bouncing Target">
    <img class="bouncing-img" src="stuff/images/image.png" alt="Bouncing Target">

    <script>
        const images = document.querySelectorAll('.bouncing-img');
        const imgData = [];

        images.forEach((img, index) => {
            imgData.push({
                element: img,
                x: Math.random() * (window.innerWidth - 150),
                y: Math.random() * (window.innerHeight - 150),
                speedX: (index === 0 ? 3 : -3) * (Math.random() * 0.5 + 0.8),
                speedY: (index === 0 ? 3 : -3) * (Math.random() * 0.5 + 0.8),
                width: 150,
                height: 150
            });
        });

        function updateBounce() {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            imgData.forEach(img => {
                img.x += img.speedX;
                img.y += img.speedY;

                if (img.x <= 0) {
                    img.x = 0;
                    img.speedX *= -1;
                } else if (img.x + img.width >= screenWidth) {
                    img.x = screenWidth - img.width;
                    img.speedX *= -1;
                }

                if (img.y <= 0) {
                    img.y = 0;
                    img.speedY *= -1;
                } else if (img.y + img.height >= screenHeight) {
                    img.y = screenHeight - img.height;
                    img.speedY *= -1;
                }

                img.element.style.transform = `translate3d(${img.x}px, ${img.y}px, 0px)`;
            });

            requestAnimationFrame(updateBounce);
        }

        requestAnimationFrame(updateBounce);

        window.addEventListener('resize', () => {
            imgData.forEach(img => {
                if (img.x + img.width > window.innerWidth) img.x = window.innerWidth - img.width;
                if (img.y + img.height > window.innerHeight) img.y = window.innerHeight - img.height;
            });
        });
    </script>

</body> 
</html>
