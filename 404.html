<!DOCTYPE html> 
<html> 
<head> 
    <title>Had404p</title> 
    <style> 
        body { 
            background-color: #000000; 
            margin: 0; 
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        } 
        .bouncing-link {
            position: absolute;
            display: block;
            width: 150px;
            height: 150px;
            text-decoration: none;
        }
        .bouncing-img { 
            width: 150px;
            height: 150px;
            object-fit: contain;
            cursor: pointer;
            transition: filter 0.2s ease;
        }
        .bouncing-img:hover {
            filter: brightness(1.2);
        }
        .error-text {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: -1;
        }
    </style> 
</head> 
<body> 

    <a href="stuff/images/image.png" target="_blank" class="bouncing-link">
        <img class="bouncing-img" src="stuff/images/image.png" alt="Bouncing Target">
    </a>
    <a href="stuff/images/image.png" target="_blank" class="bouncing-link">
        <img class="bouncing-img" src="stuff/images/image.png" alt="Bouncing Target">
    </a>
    <a href="stuff/images/image.png" target="_blank" class="bouncing-link">
        <img class="bouncing-img" src="stuff/images/image.png" alt="Bouncing Target">
    </a>
    <a href="stuff/images/image.png" target="_blank" class="bouncing-link">
        <img class="bouncing-img" src="stuff/images/image.png" alt="Bouncing Target">
    </a>
    <a href="stuff/images/image.png" target="_blank" class="bouncing-link">
        <img class="bouncing-img" src="stuff/images/image.png" alt="Bouncing Target">
    </a>

    <script>
        const links = document.querySelectorAll('.bouncing-link');
        const imgData = [];

        links.forEach((link, index) => {
            imgData.push({
                link: link,
                x: Math.random() * (window.innerWidth - 150),
                y: Math.random() * (window.innerHeight - 150),
                speedX: (index === 0 ? 3 : -3) * (Math.random() * 0.5 + 0.8),
                speedY: (index === 0 ? 3 : -3) * (Math.random() * 0.5 + 0.8),
                width: 150,
                height: 150
            });
        });

        function updateBounce() {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            imgData.forEach(obj => {
                obj.x += obj.speedX;
                obj.y += obj.speedY;

                if (obj.x <= 0) {
                    obj.x = 0;
                    obj.speedX *= -1;
                } else if (obj.x + obj.width >= screenWidth) {
                    obj.x = screenWidth - obj.width;
                    obj.speedX *= -1;
                }

                if (obj.y <= 0) {
                    obj.y = 0;
                    obj.speedY *= -1;
                } else if (obj.y + obj.height >= screenHeight) {
                    obj.y = screenHeight - obj.height;
                    obj.speedY *= -1;
                }

                obj.link.style.transform = `translate3d(${obj.x}px, ${obj.y}px, 0px)`;
            });

            requestAnimationFrame(updateBounce);
        }

        requestAnimationFrame(updateBounce);

        window.addEventListener('resize', () => {
            imgData.forEach(obj => {
                if (obj.x + obj.width > window.innerWidth) obj.x = window.innerWidth - obj.width;
                if (obj.y + obj.height > window.innerHeight) obj.y = window.innerHeight - obj.height;
            });
        });
    </script>

    <h1 class="error-text" style="font-size:20px;color:red;text-align: center;word-wrap: break-word;">404 not found</h1>

</body> 
</html>
