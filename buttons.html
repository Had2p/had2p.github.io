<!DOCTYPE html> 
<html> 
<head> 
    <title>Had2p - Buttons</title> 
    <style> 
        body { 
            background-color: #000000; 
            margin: 0; 
            padding-top: 50px; 
        } 
        .btn-container { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
        } 
        .badge-link img { 
            height: 40px; 
            border-radius: 4px; 
        } 
    </style> 
</head> 
<body> 

    <div class="btn-container"> 
        <a href="https://steamcommunity.com" target="_blank" class="badge-link"> 
            <img alt="Static Badge" src="https://img.shields.io/badge/Steam-2A475E?style=plastic&logo=Steam&logoColor=white"> 
        </a> 
        <a href="https://github.com" target="_blank" class="badge-link"> 
            <img alt="Static Badge" src="https://img.shields.io/badge/Github-000000?style=plastic&logo=Github"> 
        </a> 
    </div> 

</body> 
</html>
