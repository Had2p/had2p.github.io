<!DOCTYPE html> 
<html> 
<head> 
    <title>Had2p - Breathing Images</title> 
    <style> 
        body { 
            background-color: #000000; 
            margin: 0; 
            padding-top: 100px; 
            display: flex;
            justify-content: center;
            gap: 40px;
            overflow: hidden;
        } 
        .breathing-img { 
            width: 200px;
            height: 200px;
            object-fit: contain;
            will-change: transform;
        } 
    </style> 
</head> 
<body> 

    <!-- Your target image elements placed side-by-side -->
    <img class="breathing-img" src="stuff/images/image.png" alt="Breathing Target">
    <img class="breathing-img" src="stuff/images/image.png" alt="Breathing Target">

    <script>
        // Setup configuration values so the math calculation functions properly
        let basescale = 1.0;
        let amp = 0.2;
        let freq = 0.05;
        let angle = 0;

        // Collect all target images into the array used by your script logic
        const imgssin = document.querySelectorAll('.breathing-img');

        // Your exact script animation engine execution block
        imgssin.forEach(imgonesin => { 
            function animatesin() { 
                const scaleX = basescale + Math.sin(angle) * amp; 
                const scaleY = basescale + Math.cos(angle) * amp; 
                imgonesin.style.transform = `scale(${scaleX}, ${scaleY})`; 
                angle += freq; 
                setTimeout(() => {
                    requestAnimationFrame(animatesin);
                }, 100 / 1); 
            } 
            setTimeout(() => {
                requestAnimationFrame(animatesin);
            }, 100 / 1); 
        }); 
    </script>

</body> 
</html>
