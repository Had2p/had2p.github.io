<!DOCTYPE html> 
<html> 
<head> 
    <title>Had2p</title> 
    <style> 
        body { 
            background-image: url('stuff/images/image.png');
            background-repeat: repeat;
            background-position: center;
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding-top: 140px; 
            margin: 0; 
            min-height: 100vh;
            overflow-x: hidden;
            animation: smoothResizeBg 10s infinite ease-in-out;
        } 
        
        h1 { 
            font-family: mingliu; 
            -webkit-font-smoothing: none; 
            -moz-osx-font-smoothing: unset; 
            text-rendering: optimizeSpeed;
            font-size: 5.5rem; 
            font-weight: normal; 
            margin-bottom: 20px; 
            display: inline-block;
        } 
        
        p { 
            color: #ffffff; 
            font-size: 1.2rem; 
            margin-bottom: 45px; 
            display: inline-block;
            max-width: 80%;
        } 

        .content-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-container { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            display: inline-flex;
        } 

        .badge-link { 
            text-decoration: none; 
            transition: transform 0.2s ease; 
        } 

        .badge-link:hover { 
            transform: scale(1.08) translateY(-2px); 
        } 

        .badge-link img { 
            height: 40px; 
            border-radius: 4px; 
        } 

        @keyframes smoothResizeBg {
            0% {
                background-size: 100% 100%;
                transform: skew(0deg, 0deg);
            }
            30% {
                background-size: 100% 220%;
                transform: skew(0deg, 0deg);
            }
            60% {
                background-size: 220% 220%;
                transform: skew(12deg, 12deg);
            }
            100% {
                background-size: 100% 100%;
                transform: skew(0deg, 0deg);
            }
        }
    </style> 
</head> 
<body> 

    <div class="content-box"> 
        <h1>HAD2P</h1> 
        <p>Welcome to my stupid website i suck at coding never ask me to code</p> 
        <div class="btn-container"> 
            <a href="https://steamcommunity.com" target="_blank" class="badge-link"> 
                <img alt="Static Badge" src="https://shields.io"> 
            </a> 
            <a href="https://github.com" target="_blank" class="badge-link"> 
                <img alt="Static Badge" src="https://shields.io"> 
            </a> 
        </div> 
    </div> 

</body> 
</html>
