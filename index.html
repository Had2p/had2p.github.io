<!DOCTYPE html> 
<html> 
<head> 
    <title>Had2p</title> 
    <style> 
        body { 
            background-color: #000000; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding-top: 140px; 
            margin: 0; 
            perspective: 1000px; /* Crucial for making the 3D text rotation pop outward */
        } 
        
        /* This binds your animation directly to your main name heading */
        h1 { 
            font-size: 5.5rem; 
            font-weight: normal; 
            margin-bottom: 20px; 
            display: inline-block;
            animation: tilt3d 10s infinite linear; 
            transform-style: preserve-3d;
        } 
        
        p { 
            color: #8b949e; 
            font-size: 1.2rem; 
            margin-bottom: 45px; 
        } 
        .btn-container { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
        } 
        .badge-link { 
            text-decoration: none; 
            transition: transform 0.2s ease; 
        } 
        .badge-link:hover { 
            transform: scale(1.08) translateY(-2px); 
        } 
        .badge-link img { 
            height: 40px; 
            border-radius: 4px; 
        } 

        /* Your exact 3D keyframe timeline layout with style tags removed */
        @keyframes tilt3d {
            0% { transform: rotateX(15deg); }
            5% { transform: rotateY(15deg); }
            10% { transform: rotateX(-15deg); }
            15% { transform: rotateY(-15deg); }
            20% { transform: rotateX(15deg); }
            25% { transform: rotateY(15deg); }
            30% { transform: rotateX(-15deg); }
            35% { transform: rotateY(-15deg); }
            40% { transform: rotateX(15deg); }
            45% { transform: rotateY(15deg); }
            50% { transform: rotateX(-15deg); }
            55% { transform: rotateY(-15deg); }
            60% { transform: rotateX(15deg); }
            65% { transform: rotateY(15deg); }
            70% { transform: rotateX(-15deg); }
            75% { transform: rotateY(-15deg); }
            80% { transform: rotateX(15deg); }
            85% { transform: rotateY(15deg); }
            90% { transform: rotateX(-15deg); }
            95% { transform: rotateY(-15deg); }
            100% { transform: rotateX(15deg); }
        }
    </style> 
</head> 
<body> 

    <h1>HAD2P</h1> 
    <p>Welcome to my stupid website i suck at coding never ask me to code</p> 

    <div class="btn-container"> 
        <!-- Steam Profile Plastic Badge using your exact configuration link --> 
        <a href="https://steamcommunity.com" target="_blank" class="badge-link"> 
            <img alt="Static Badge" src="https://shields.io"> 
        </a> 

        <!-- Matching style GitHub Profile Badge --> 
        <a href="https://github.com" target="_blank" class="badge-link"> 
            <img alt="Static Badge" src="https://shields.io"> 
        </a> 
    </div> 

</body> 
</html>
