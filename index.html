<!DOCTYPE html> 
<html> 
<head> 
    <title>Had2p</title> 
    <style> 
        body { 
            background-image: url('stuff/images/image.png');
            background-size: 200% 200%;
            background-repeat: repeat;
            background-position: center;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding-top: 140px; 
            margin: 0; 
            perspective: 1000px;
            min-height: 100vh;
        } 
        h1 { 
            font-family: mingliu; 
            -webkit-font-smoothing: none; 
            -moz-osx-font-smoothing: unset; 
            text-rendering: optimizeSpeed;
            font-size: 5.5rem; 
            font-weight: normal; 
            margin-bottom: 20px; 
            display: inline-block;
            animation: tilt3d 10s infinite linear; 
            transform-style: preserve-3d;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 0px 20px;
            border-radius: 4px;
        } 
        p { 
            color: #ffffff; 
            font-size: 1.2rem; 
            margin-bottom: 45px; 
            display: inline-block;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 4px;
            max-width: 80%;
        } 
        .content-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn-container { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 4px;
            display: inline-flex;
        } 
        .badge-link { 
            text-decoration: none; 
            transition: transform 0.2s ease; 
        } 
        .badge-link:hover { 
            transform: scale(1.08) translateY(-2px); 
        } 
        .badge-link img { 
            height: 40px; 
            border-radius: 4px; 
        } 
        @keyframes tilt3d {
            0%   { transform: rotateX(15deg) rotateY(0deg); }
            5%   { transform: rotateX(0deg) rotateY(15deg); }
            10%  { transform: rotateX(-15deg) rotateY(0deg); }
            15%  { transform: rotateX(0deg) rotateY(-15deg); }
            20%  { transform: rotateX(15deg) rotateY(0deg); }
            25%  { transform: rotateX(0deg) rotateY(15deg); }
            30%  { transform: rotateX(-15deg) rotateY(0deg); }
            35%  { transform: rotateX(0deg) rotateY(-15deg); }
            40%  { transform: rotateX(15deg) rotateY(0deg); }
            45%  { transform: rotateX(0deg) rotateY(15deg); }
            50%  { transform: rotateX(-15deg) rotateY(0deg); }
            55%  { transform: rotateX(0deg) rotateY(-15deg); }
            60%  { transform: rotateX(15deg) rotateY(0deg); }
            65%  { transform: rotateX(0deg) rotateY(15deg); }
            70%  { transform: rotateX(-15deg) rotateY(0deg); }
            75%  { transform: rotateX(0deg) rotateY(-15deg); }
            80%  { transform: rotateX(15deg) rotateY(0deg); }
            85%  { transform: rotateX(0deg) rotateY(15deg); }
            90%  { transform: rotateX(-15deg) rotateY(0deg); }
            95%  { transform: rotateX(0deg) rotateY(-15deg); }
            100% { transform: rotateX(15deg) rotateY(0deg); }
        }
    </style> 
</head> 
<body> 
    <div class="content-box">
        <h1>HAD2P</h1> 
        <p>Welcome to my stupid website i suck at coding never ask me to code</p> 
        <div class="btn-container"> 
            <a href="https://steamcommunity.com/id/had2p/" target="_blank" class="badge-link"> 
                <img alt="Static Badge" src="https://img.shields.io/badge/Steam-2A475E?style=plastic&logo=Steam&logoColor=white"> 
            </a> 
            <a href="https://github.com/had2p" target="_blank" class="badge-link"> 
                <img alt="Static Badge" src=""> 
            </a> 
        </div> 
    </div>
</body> 
</html>
